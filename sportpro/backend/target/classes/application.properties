# ============================================================
# application.properties — Configurações gerais do SportPro
# ============================================================

# --- Servidor ---
server.port=8080

# --- Banco de Dados MySQL ---
spring.datasource.url=jdbc:postgresql://aws-1-sa-east-1.pooler.supabase.com:6543/postgres
spring.datasource.username=postgres.ayoonjbwhndsiruktuuk
spring.datasource.password=49wGnrlaIrtxywM649wGnrlaIrtxywM6
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update: atualiza o schema sem apagar dados (use validate em produção)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Desabilita prepared statements (necess�rio para o Supabase Pooler) ---
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# --- Jackson (serialização JSON) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# --- Integração n8n ---
# URL do webhook n8n — substitua pelo endpoint real
n8n.webhook.url=http://localhost:5678/webhook/sportpro

# --- Logs ---
logging.level.com.sportpro=DEBUG
logging.level.org.hibernate.SQL=DEBUG
