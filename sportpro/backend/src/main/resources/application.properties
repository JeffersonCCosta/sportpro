# --- Servidor ---
server.port=8080

# --- Banco de Dados SUPABASE ---
spring.datasource.url=jdbc:postgresql://db.ayoonjbwhndsiruktuuk.supabase.co:5432/postgres
spring.datasource.username=postgres
spring.datasource.password=e4wdRfjHSRa8oZDi
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# update: atualiza o schema sem apagar dados (use validate em produção)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Desabilita prepared statements (necess�rio para o Supabase Pooler) ---
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# --- Jackson (serialização JSON) ---
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

# --- Integração n8n ---
n8n.webhook.url=http://127.0.0.1:5678/webhook/sportpro

# --- Logs ---
logging.level.com.sportpro=DEBUG
logging.level.org.hibernate.SQL=DEBUG