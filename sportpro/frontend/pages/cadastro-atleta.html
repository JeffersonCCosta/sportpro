<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro Atleta — SportPro</title>
  <link rel="stylesheet" href="../css/global.css">
  <style>
    body { display: flex; align-items: flex-start; justify-content: center; min-height: 100vh; padding: 5rem 2rem 3rem; }

    .cadastro-wrapper { width: 100%; max-width: 520px; }

    .back-link {
      display: inline-flex; align-items: center; gap: 0.4rem;
      color: var(--text-muted); font-size: 0.88rem;
      margin-bottom: 1.5rem; transition: var(--transition);
    }
    .back-link:hover { color: var(--brand); }

    .cadastro-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 2.5rem;
    }

    .cadastro-header { margin-bottom: 2rem; }
    .cadastro-header h1 { font-size: 2rem; }
    .cadastro-header p { color: var(--text-muted); margin-top: 0.25rem; font-size: 0.9rem; }

    .form-stack { display: flex; flex-direction: column; gap: 1.25rem; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }

    .step-indicator {
      display: flex; gap: 0.5rem; margin-bottom: 2rem;
    }
    .step-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--border);
    }
    .step-dot.active { background: var(--brand); }

    .alert-container { margin-bottom: 1rem; }

    @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="cadastro-wrapper">
    <a href="index.html" class="back-link">← Voltar</a>

    <div class="cadastro-card">
      <div class="step-indicator">
        <div class="step-dot active"></div>
        <div class="step-dot"></div>
        <div class="step-dot"></div>
      </div>

      <div class="cadastro-header">
        <h1>Criar conta de Atleta</h1>
        <p>Preencha seus dados para começar sua jornada esportiva.</p>
      </div>

      <div class="alert-container"></div>

      <form class="form-stack" onsubmit="handleCadastro(event)">
        <div class="form-group">
          <label class="form-label">Nome completo</label>
          <input type="text" id="nome" class="form-control" placeholder="Seu nome" required minlength="3">
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <input type="email" id="email" class="form-control" placeholder="seu@email.com" required>
        </div>

        <div class="form-group">
          <label class="form-label">Senha</label>
          <input type="password" id="senha" class="form-control" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label">Idade</label>
            <input type="number" id="idade" class="form-control" placeholder="Ex: 25" min="10" max="100" required>
          </div>
          <div class="form-group">
            <label class="form-label">Peso (kg)</label>
            <input type="number" id="peso" class="form-control" placeholder="Ex: 70" step="0.1" min="30" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Altura (m)</label>
          <input type="number" id="altura" class="form-control" placeholder="Ex: 1.75" step="0.01" min="1.0" max="2.5" required>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="btn-cadastro">
          Criar conta de Atleta
        </button>
      </form>

      <p class="text-center text-sm text-muted mt-2">
        Já tem conta? <a href="login.html" style="color:var(--brand);font-weight:600;">Fazer login</a>
      </p>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    async function handleCadastro(e) {
      e.preventDefault();
      const btn = document.getElementById('btn-cadastro');
      UI.setLoading(btn, true);

      const payload = {
        nome: document.getElementById('nome').value,
        email: document.getElementById('email').value,
        senha: document.getElementById('senha').value,
        idade: parseInt(document.getElementById('idade').value),
        peso: parseFloat(document.getElementById('peso').value),
        altura: parseFloat(document.getElementById('altura').value)
      };

      try {
        const result = await AtletaAPI.cadastrar(payload);

        // Salva sessão e redireciona para dashboard
        Session.save({ data: { ...result.data, tipo: 'ATLETA' } });

        UI.showAlert('Conta criada com sucesso!', 'success', document.querySelector('.alert-container'));

        setTimeout(() => window.location.href = 'dashboard-atleta.html', 1000);

      } catch (err) {
        UI.showAlert(err.message, 'error', document.querySelector('.alert-container'));
        UI.setLoading(btn, false);
      }
    }
  </script>
</body>
</html>
